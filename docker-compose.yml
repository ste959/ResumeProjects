# Full BondDesk OMS stack: Postgres + Kafka + OMS backend + risk service + React UI.
# Usage:  docker compose up --build
#   UI:            http://localhost:8088
#   OMS API/Swagger: http://localhost:8080/swagger-ui.html
#   Risk API:      http://localhost:8081/api/risk/summary

# Fixed project name so `docker compose` manages the same stack regardless of the
# directory it is invoked from.
name: bonddesk-oms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bonddesk
      POSTGRES_USER: bonddesk
      POSTGRES_PASSWORD: bonddesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonddesk -d bonddesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/bonddesk
      DB_USERNAME: bonddesk
      DB_PASSWORD: bonddesk
      OMS_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  risk-service:
    build: ./risk-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  research-service:
    build:
      context: ./research
      dockerfile: service/Dockerfile
    volumes:
      # The columnar warehouse (bars/fundamentals/macro/options), read-only, so live backtests work.
      - ./research/data:/app/data:ro
    environment:
      # Alpaca paper-trading credentials — supplied via the repo-root .env (never committed).
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
    ports:
      - "8082:8082"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  pgdata:
