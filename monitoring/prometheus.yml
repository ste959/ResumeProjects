# Prometheus scrape config — pulls metrics from every service in the compose stack.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# SLO recording + burn-rate alerting rules (the .test.yml fixtures are excluded by the glob).
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: oms-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: risk-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["risk-service:8081"]

  - job_name: research-service
    metrics_path: /metrics
    static_configs:
      - targets: ["research-service:8082"]
