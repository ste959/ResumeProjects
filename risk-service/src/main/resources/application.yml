server:
  port: 8081
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

spring:
  application:
    name: risk-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: risk-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrap the JSON deserializer so a malformed record surfaces as a handleable error instead of
      # throwing in the poll loop and re-reading the same offset forever (a poison pill wedging the
      # whole consumer). The DefaultErrorHandler (see KafkaErrorHandlingConfig) then routes it to the DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The OMS publishes plain JSON with no type headers, so pin the target type here.
        spring.json.value.default.type: com.bonddesk.risk.OrderEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.bonddesk.risk
    # Producer used only by the dead-letter recoverer to republish failed records (raw bytes) to the DLT.
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    listener:
      # Consume with N threads (≤ the topic's partition count) instead of a single thread, so risk
      # aggregation keeps up as the event rate grows. Per-key ordering is preserved because all events
      # for one order share a partition, and a partition is owned by exactly one consumer thread.
      concurrency: ${RISK_CONSUMER_CONCURRENCY:3}
      # Continue the OMS's distributed trace: read the traceparent from each record's headers and open
      # the processing span as a child of the producing request's span.
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: risk-service
  tracing:
    # Sample every trace in this demo so the whole flow is always visible. Turn this down in a real
    # deployment. Export stays off until a collector endpoint is configured (no reporter is bundled).
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

oms:
  kafka:
    topic: order-events

logging:
  level:
    com.bonddesk.risk: INFO
  # traceId,spanId tie a log line into the distributed trace (grep one order's flow across services);
  # correlationId is the edge request id echoed to clients. Both are empty off-request.
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-}]"
