name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: OMS backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  risk-service:
    name: Risk service (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  frontend:
    name: Trader UI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck & build
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, risk-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bonddesk/oms-backend:ci ./backend
      - name: Build risk-service image
        run: docker build -t bonddesk/risk-service:ci ./risk-service
      - name: Build frontend image
        run: docker build -t bonddesk/frontend:ci ./frontend
