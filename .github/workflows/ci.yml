name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: OMS backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  risk-service:
    name: Risk service (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  frontend:
    name: Trader UI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest + React Testing Library)
        run: npm test
      - name: Typecheck & build
        run: npm run build

  validation-harness:
    name: Validation harness (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m pytest harness -q          # stdlib only, no install
      - name: Determinism / flakiness gate
        run: python -m harness --check-determinism --repeats 5   # fail if any scenario's verdict is unstable
      - name: Run the example validation suite (CI gate)
        run: python -m harness --out artifacts --repro-dir repro  # non-zero exit fails on FAIL/ERROR
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            artifacts/
            repro/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for the API (via the UI proxy) to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8088/api/securities >/dev/null && exit 0
            sleep 5
          done
          echo "Stack did not come up in time"; docker compose logs --tail=80; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E against the running stack
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8088
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker images build + scan
    runs-on: ubuntu-latest
    needs: [backend, risk-service, frontend]
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bonddesk/oms-backend:ci ./backend
      - name: Build risk-service image
        run: docker build -t bonddesk/risk-service:ci ./risk-service
      - name: Build frontend image
        run: docker build -t bonddesk/frontend:ci ./frontend
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: bonddesk/oms-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"          # report-only: surface findings without failing the build
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image
