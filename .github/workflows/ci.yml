name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: OMS backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  risk-service:
    name: Risk service (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  frontend:
    name: Trader UI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest + React Testing Library)
        run: npm test
      - name: Typecheck & build
        run: npm run build

  validation-harness:
    name: Validation harness (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test runner
        run: python -m pip install --quiet pytest   # the harness code is stdlib-only; its tests use pytest
      - name: Unit tests
        run: python -m pytest harness -q
      - name: Determinism / flakiness gate
        run: python -m harness --check-determinism --repeats 5   # fail if any scenario's verdict is unstable
      - name: Run the example validation suite (CI gate)
        run: python -m harness --out artifacts --repro-dir repro  # non-zero exit fails on FAIL/ERROR
      - name: Quality-gate machinery self-check
        run: |                                      # capture + gate on the same runner (matched hardware)
          python -m harness --capture-baseline /tmp/baseline.json
          python -m harness --baseline /tmp/baseline.json
        # Note: perf baselines are hardware-specific, so cross-machine perf gating runs in the lab,
        # not CI. Here we only verify the gate machinery is green on matched hardware.
      - name: Config-matrix run
        run: python -m harness --matrix --out artifacts   # run the suite across the example config matrix
      - name: Tamper-evidence self-check
        run: |
          python -m harness --out artifacts --seal        # seal the run
          python -m harness --verify artifacts/report.json  # intact → passes
          # Tamper a material field and confirm verification now FAILS (the control actually fires):
          python -c "import json,pathlib as P; f=P.Path('artifacts/report.json'); d=json.loads(f.read_text()); d['results'][0]['seed']=d['results'][0].get('seed',0)+1; f.write_text(json.dumps(d))"
          if python -m harness --verify artifacts/report.json >/dev/null; then echo 'tampering NOT detected'; exit 1; fi
          echo 'tampering correctly detected'
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            artifacts/
            repro/

  analytics:
    name: Analytics (dbt)
    runs-on: ubuntu-latest
    # Stand up a real Postgres, load a fixture that mirrors the OMS source tables, then run the
    # dbt models AND their data-quality tests as one gated step. Verifies the analytics layer the
    # same way the rest of the repo is verified: on every push/PR, against a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bonddesk
          POSTGRES_PASSWORD: bonddesk
          POSTGRES_DB: bonddesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bonddesk"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bonddesk
      POSTGRES_PASSWORD: bonddesk
      POSTGRES_DB: bonddesk
      # Absolute: the dbt steps run inside analytics/ (working-directory), so a relative value
      # would resolve to analytics/analytics. profiles.yml lives at the repo's analytics/.
      DBT_PROFILES_DIR: ${{ github.workspace }}/analytics
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        # Pin both core and the adapter to the stable 1.9 line; an unpinned adapter let pip pull a
        # 2.0.0-beta of dbt-core, which is non-reproducible and changes profile resolution.
        run: |
          python -m pip install --quiet "dbt-core~=1.9.0" "dbt-postgres~=1.9.0"
          dbt --version
      - name: Load raw fixture (stand-in for the live OMS tables dbt reads)
        run: psql "postgresql://bonddesk:bonddesk@localhost:5432/bonddesk" -v ON_ERROR_STOP=1 -f ci/seed_raw.sql
      - name: dbt build (models + data-quality tests)
        run: dbt build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for the API (via the UI proxy) to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8088/api/securities >/dev/null && exit 0
            sleep 5
          done
          echo "Stack did not come up in time"; docker compose logs --tail=80; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E against the running stack
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8088
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker images build + scan
    runs-on: ubuntu-latest
    needs: [backend, risk-service, frontend]
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bonddesk/oms-backend:ci ./backend
      - name: Build risk-service image
        run: docker build -t bonddesk/risk-service:ci ./risk-service
      - name: Build frontend image
        run: docker build -t bonddesk/frontend:ci ./frontend
      - name: Scan backend image (Trivy)
        # Run Trivy from its official pinned container against the image exported as a tarball
        # (docker save → --input), rather than the trivy-action + setup-trivy path. That path
        # downloads the latest Trivy binary at runtime via an install script, which fails on
        # shared-runner GitHub API rate limits ("found version 0.64.1" → exit 1) and drags in
        # setup-trivy tags that upstream deletes. A pinned image is reproducible and needs no
        # binary install or docker socket. Report-only (--exit-code 0): surface findings, never
        # fail the build; GITHUB_TOKEN lifts the anonymous rate limit on the vuln-DB pull.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker save bonddesk/oms-backend:ci -o oms-backend.tar
          docker run --rm -e GITHUB_TOKEN -v "${{ github.workspace }}:/work" -w /work \
            aquasec/trivy:0.64.1 image \
              --input oms-backend.tar \
              --format sarif --output trivy-backend.sarif \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image
