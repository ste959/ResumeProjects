name: Analytics nightly

# Scheduled orchestration: run the ops-analytics pipeline as a Prefect flow every night (and on
# demand). This is the "data orchestration" leg — the same flow that would run behind a Prefect
# deployment, triggered here on a schedule. It refreshes the marts from the fixture, runs the models
# and their data-quality tests, reports source freshness, and verifies the BI layer end-to-end.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  pipeline:
    name: Ops-analytics pipeline (Prefect)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bonddesk
          POSTGRES_PASSWORD: bonddesk
          POSTGRES_DB: bonddesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bonddesk"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bonddesk
      POSTGRES_PASSWORD: bonddesk
      POSTGRES_DB: bonddesk
      DBT_PROFILES_DIR: ${{ github.workspace }}/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt + Prefect
        run: |
          python -m pip install --quiet "dbt-core~=1.9.0" "dbt-postgres~=1.9.0" "prefect>=3.1,<4"
          dbt --version
          python -c "import prefect; print('prefect', prefect.__version__)"
      - name: Run the ops-analytics pipeline (Prefect flow, seeds the fixture)
        run: python analytics/orchestration/flow.py
