# BondDesk Ops Analytics — a dbt project that turns the OMS's operational tables
# (orders, executions) into a tested, dimensional analytics layer: staging → marts → KPIs.
# dbt only *reads* the OMS tables; the OMS (Flyway) owns them. See analytics/README.md.
name: 'bonddesk_analytics'
version: '1.0.0'
config-version: 2

profile: 'bonddesk_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  bonddesk_analytics:
    staging:
      # Staging is a thin, non-materialized rename/clean layer over the raw sources.
      +materialized: view
    marts:
      # Marts are physical tables: this is what BI (Metabase) and executives query.
      +materialized: table
