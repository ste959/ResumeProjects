spring:
  application:
    name: bonddesk-oms

  # Default profile runs entirely in-memory (H2) so the OMS starts with nothing but a
  # JDK. Hibernate builds the schema here; the PostgreSQL profile uses Flyway instead.
  datasource:
    url: jdbc:h2:mem:oms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Application-specific settings
oms:
  kafka:
    enabled: false
    topic: order-events
  matching:
    enabled: true          # route orders to the CLOB matching engine
    liquidity:
      interval-ms: 1500     # market-maker quote-refresh cadence
  # Origin patterns allowed to call the API from a browser. "*" port covers the Vite
  # dev server (:5173) and the nginx-served UI (:8088). Set to your real domain in prod.
  cors:
    allowed-origins: http://localhost:*

compliance:
  max-order-notional: 25000000
  max-security-notional-per-portfolio: 50000000
  min-rating: BB_MINUS

logging:
  level:
    com.bonddesk.oms: INFO
    order-events: INFO
