spring:
  application:
    name: bonddesk-oms

  # ~11 @Scheduled jobs (strategy tick, liquidity refresh, L2 flush, curve refresh, recorders, the
  # outbox relay + purge) share this pool. Default size is 1, which serialises them, so one slow job
  # stalls the live loop; sized above the concurrently-eligible job count so they don't queue behind
  # each other. (The Alpaca broker reconciler, whose HTTP calls can block for seconds, runs on its own
  # dedicated executor and is deliberately not on this shared pool.)
  task:
    scheduling:
      pool:
        size: 12

  # Optional, git-ignored file holding Alpaca API keys for the equities module. "optional:"
  # means the app still boots if it is absent (the equities feed just stays idle).
  config:
    import: optional:file:./alpaca-local.yml

  # Default profile runs entirely in-memory (H2) so the OMS starts with nothing but a
  # JDK. Hibernate builds the schema here; the PostgreSQL profile uses Flyway instead.
  datasource:
    url: jdbc:h2:mem:oms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  h2:
    console:
      # OFF by default. The H2 console runs arbitrary SQL and is a known RCE/SSRF vector, so it must
      # never be exposed unauthenticated. Flip H2_CONSOLE_ENABLED=true for local debugging only.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

server:
  port: 8080
  shutdown: graceful          # let in-flight requests finish on SIGTERM instead of being cut

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Only reveal component/diskspace details to an authenticated principal — otherwise
      # /actuator/health leaks internal topology to anyone who can reach the port.
      show-details: when-authorized
      show-components: when-authorized
  health:
    diskspace:
      enabled: true
    circuitbreakers:
      enabled: true      # surface Resilience4j breaker state under /actuator/health
  metrics:
    tags:
      application: bonddesk-oms
  tracing:
    # Sample every trace in this demo so a full order flow is always visible end-to-end. Turn down in
    # production. Export stays off until management.zipkin.tracing.endpoint points at a collector
    # (Zipkin/Tempo) — no reporter is bundled, so tracing is otherwise local-only (ids in the logs).
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  info:
    env:
      enabled: false     # don't surface environment/config through /actuator/info

info:
  app:
    name: BondDesk OMS
    description: Exchange + fixed-income desk + OMS (Spring Boot)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Application-specific settings
oms:
  kafka:
    enabled: false
    topic: order-events
  matching:
    enabled: true          # route orders to the CLOB matching engine
    liquidity:
      interval-ms: 1500     # market-maker quote-refresh cadence
  crypto:
    enabled: true          # live Coinbase market-data feed (public, no API key)
    ws-url: wss://advanced-trade-ws.coinbase.com
    products: [BTC-USD, ETH-USD, SOL-USD]
  equities:
    enabled: true          # live Alpaca IEX feed + paper-broker execution
    # Credentials come from the environment or the git-ignored alpaca-local.yml; blank
    # here means the module boots idle until keys are supplied.
    key-id: ${ALPACA_KEY_ID:}
    secret-key: ${ALPACA_SECRET_KEY:}
    symbols: [AAPL, MSFT, NVDA, AMZN, JPM, TSLA]
    data-base-url: https://data.alpaca.markets   # REST snapshots host (distinct from the trading API)
  fixedincome:
    live-curve: true         # fetch the real daily US Treasury par-yield curve (keyless)
    dealer-count: 5          # dealers responding to each RFQ
    rfq-ttl-seconds: 30      # how long dealer quotes stay firm
  rebalance:
    # Equity rebalance path (target book -> delta orders -> paper venue). Plumbing validation
    # only, so it is DISABLED by default: the controller is not registered unless enabled=true,
    # and the endpoint dry-runs by default. No validated edge — this is not a live strategy.
    enabled: false
    gross-capital: 100000          # dollars the unit-gross target weights are scaled to
    portfolio: EQUITY-PAPER
    target-book-path: target-book/target-book.json
    max-gross-notional: 250000     # tight cap on the paper equity book (rebalance uses the tighter
                                   # of this and the desk-wide oms.risk.max-gross-notional)
    # Market-hours auto-rebalancer. ALL SAFE-OFF by default: the scheduler is inert unless BOTH the
    # module (enabled) and auto-enabled are true, only runs while the broker reports the market open,
    # and at most once per America/New_York trading day. Position reconcile is likewise opt-in.
    auto-enabled: false            # market-hours auto-rebalancer (off — never auto-trades until set true)
    reconcile-positions: false     # snap OMS positions to broker truth on startup / before each auto run
    check-interval-ms: 300000      # how often the scheduler wakes to check market hours + the daily guard
  security:
    # Authn/authz (see SecurityConfig): JWT for users, API key for machines. Reads are public; writes
    # require a role (@PreAuthorize). Enforcement is always on.
    api-key: ${OMS_API_KEY:}                       # machine access (ROLE_SERVICE); blank → inert
    seed-demo-users: ${OMS_SEED_DEMO_USERS:true}   # seed admin/trader/viewer on first boot — DISABLE in prod
    jwt:
      secret: ${OMS_JWT_SECRET:}                   # HMAC signing secret (SHA-256-derived); dev default if blank
      ttl-minutes: ${OMS_JWT_TTL_MINUTES:60}
  risk:
    # Aggregate pre-trade breaker on the live order path: reject an order that would push a
    # portfolio's total gross notional (open positions + this order) over this limit. A
    # non-positive value disables the check. $50MM desk-wide — a real cap (not the old $1bn no-op),
    # above the bond side's $25MM/order compliance so compliant block orders still route.
    max-gross-notional: 50000000
  # Origin patterns allowed to call the API from a browser. "*" port covers the Vite
  # dev server (:5173) and the nginx-served UI (:8088). Set to your real domain in prod.
  cors:
    allowed-origins: http://localhost:*

compliance:
  max-order-notional: 25000000
  max-security-notional-per-portfolio: 50000000
  min-rating: BB_MINUS

# Client-side resilience for outbound Alpaca (venue) calls. The distinction that makes this correct:
# only a *transient* failure (IO/timeout/5xx -> BrokerUnavailableException) is retried and counts toward
# the breaker; a *terminal* business rejection (4xx -> BrokerRejectedException) is neither retried nor
# recorded, because retrying a rejected order would never succeed and would falsely trip the breaker.
resilience4j:
  circuitbreaker:
    instances:
      alpaca:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10          # don't judge the failure rate on a tiny sample
        failure-rate-threshold: 50           # open once >=50% of the window is transient failures
        wait-duration-in-open-state: 30s     # fail fast for 30s before probing again
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.bonddesk.oms.equities.BrokerUnavailableException
        ignore-exceptions:
          - com.bonddesk.oms.equities.BrokerRejectedException
  retry:
    instances:
      alpaca:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.bonddesk.oms.equities.BrokerUnavailableException
        ignore-exceptions:
          - com.bonddesk.oms.equities.BrokerRejectedException

logging:
  level:
    com.bonddesk.oms: INFO
    order-events: INFO
  # Prefix every log line with the distributed-trace ids (traceId,spanId — Micrometer Tracing) and the
  # edge correlation id (set by CorrelationIdFilter, echoed to clients). traceId spans services and
  # Kafka; correlationId is the per-request id a client can grep on. All empty off-request.
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-}]"
