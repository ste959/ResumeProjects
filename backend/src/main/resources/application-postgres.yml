# Production-like profile: PostgreSQL + Flyway-managed schema.
# Activate with:  --spring.profiles.active=postgres
# Connection details default to the docker-compose Postgres and can be overridden by
# the DB_* environment variables (used by the Docker/Kubernetes deployments).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bonddesk}
    username: ${DB_USERNAME:bonddesk}
    password: ${DB_PASSWORD:bonddesk}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway here; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

oms:
  kafka:
    enabled: ${OMS_KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
