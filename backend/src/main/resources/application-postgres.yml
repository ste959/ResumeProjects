# Production-like profile: PostgreSQL + Flyway-managed schema.
# Activate with:  --spring.profiles.active=postgres
# Connection details default to the docker-compose Postgres and can be overridden by
# the DB_* environment variables (used by the Docker/Kubernetes deployments).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bonddesk}
    username: ${DB_USERNAME:bonddesk}
    password: ${DB_PASSWORD:bonddesk}
    driver-class-name: org.postgresql.Driver
    hikari:
      # The default 10-connection pool is shared by the fill-write path, the outbox relay, and the
      # ~12 scheduled jobs — enough to exhaust it under load, where callers then block 30s. Size it for
      # the workload and fail fast instead.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: oms-pool

  jpa:
    hibernate:
      # Schema is owned by Flyway here; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

oms:
  kafka:
    enabled: ${OMS_KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
