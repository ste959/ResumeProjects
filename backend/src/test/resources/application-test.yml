# Test profile: in-memory H2 (inherited from base config) with the matching engine and
# its market-maker switched off, so lifecycle tests drive fills deterministically through
# the API/service. The engine itself is covered by its own unit + property tests.
oms:
  matching:
    enabled: false
  kafka:
    enabled: false

logging:
  level:
    com.bonddesk.oms: WARN
